<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Jogos - Escolha a Escola</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #1c305c;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            margin-bottom: 30px;
        }
        .menu-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }
        .card-escola {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 220px;
            padding: 25px 20px;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none;
            color: white;
            text-align: center;
        }
        .card-escola:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        }
        .card-escola img {
            max-width: 140px;
            max-height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 8px;
            border-radius: 8px;
        }
        .card-escola span {
            font-size: 18px;
            font-weight: bold;
        }
        /* Cores das Instituições */
        .card-maxime { background-color: #1b2b95; }
        .card-multivix { background-color: #181818; }
        .card-unipro { background-color: #1c305c; }
    </style>
</head>
<body>

    <h1>🎓 Portal Educacional</h1>
    <p>Selecione a sua instituição para acessar os jogos:</p>

    <div class="menu-container">
        <!-- Colégio Maxime -->
        <a href="escola-maxime.html" class="card-escola card-maxime">
            <img src="figuras/logo_maxime.png" alt="Logo Maxime">
            <span>Colégio Maxime</span>
        </a>
        
        <!-- Faculdade Multivix -->
        <a href="escola-multivix.html" class="card-escola card-multivix">
            <img src="figuras/logo_multivix.png" alt="Logo Multivix">
            <span>Faculdade Multivix</span>
        </a>

        <!-- UNIPRÓ -->
        <a href="escola-unipro.html" class="card-escola card-unipro">
            <img src="figuras/logo_unipro.png" alt="Logo UNIPRÓ">
            <span>UNIPRÓ</span>
        </a>
    </div>

</body>
</html>

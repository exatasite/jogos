<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Jogos - Escolha a Escola</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #1b2b95;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .menu-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }
        .btn-escola {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 220px;
            padding: 30px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-escola:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        /* Cores das Instituições */
        .btn-maxime { background-color: #1b2b95; }
        .btn-multivix { background-color: #b2161c; }
        .btn-unipro { background-color: #1c305c; }
    </style>
</head>
<body>

    <h1>🎓 Portal Educacional</h1>
    <p>Selecione a sua instituição para acessar os jogos:</p>

    <div class="menu-container">
        <!-- Colégio Maxime -->
        <a href="escola-maxime.html" class="btn-escola btn-maxime">
            🏫<br><br>Colégio Maxime
        </a>
        
        <!-- Faculdade Multivix -->
        <a href="escola-multivix.html" class="btn-escola btn-multivix">
            🏛️<br><br>Faculdade Multivix
        </a>

        <!-- UNIPRÓ -->
        <a href="escola-unipro.html" class="btn-escola btn-unipro">
            🎓<br><br>UNIPRÓ
        </a>
    </div>

</body>
</html>
